<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Porsche 911 AR Experience</title>
    <!-- A-Frame & MindAR Libraries -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
      #soundBtn {
        position: fixed;
        bottom: 25px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 999999;
        background-color: #e10600;
        color: #ffffff;
        border: none;
        border-radius: 30px;
        padding: 12px 26px;
        font-size: 15px;
        font-weight: bold;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        cursor: pointer;
        font-family: sans-serif;
      }
    </style>
  </head>
  <body>
    <!-- Sound Toggle Button -->
    <button id="soundBtn">🔊 Tap for Sound</button>

    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <video 
          id="arVideo" 
          src="./video.mp4" 
          preload="auto" 
          loop="true" 
          crossorigin="anonymous" 
          playsinline 
          webkit-playsinline 
          muted>
        </video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Target Card Entity (2:3 Aspect Ratio) -->
      <a-entity mindar-image-target="targetIndex: 0">
        <a-video 
          src="#arVideo" 
          position="0 0 0" 
          height="1.5" 
          width="1" 
          rotation="0 0 0">
        </a-video>
      </a-entity>
    </a-scene>

    <script>
      const video = document.querySelector('#arVideo');
      const soundBtn = document.querySelector('#soundBtn');
      const targetEntity = document.querySelector('[mindar-image-target]');

      // Auto play on target detect
      targetEntity.addEventListener("targetFound", () => {
        video.play();
      });

      // Pause when out of frame
      targetEntity.addEventListener("targetLost", () => {
        video.pause();
      });

      // Sound button handler
      soundBtn.addEventListener('click', () => {
        if (video.muted) {
          video.muted = false;
          soundBtn.innerText = '🔇 Mute Sound';
          soundBtn.style.backgroundColor = '#333333';
        } else {
          video.muted = true;
          soundBtn.innerText = '🔊 Tap for Sound';
          soundBtn.style.backgroundColor = '#e10600';
        }
      });
    </script>
  </body>
</html>
